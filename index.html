<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>罗娇 · 星之星球 | 武汉理工大学 数字经济2502</title>

<!-- 字体：本地化 + 子集化（仅打包页面实际用到的字） -->
<link rel="preload" href="fonts/lxgwwenkai-subset.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/cinzel-decorative-subset.woff2" as="font" type="font/woff2" crossorigin />

<style>
/* ============================================================
   0. 字体与设计令牌
   ============================================================ */
@font-face{
  font-family:'LXGW WenKai';
  src:url('fonts/lxgwwenkai-subset.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'Cinzel Decorative';
  src:url('fonts/cinzel-decorative-subset.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap;
}

:root{
  /* 色彩规范 */
  --navy-0:#0d1b2a;         /* 主夜空 */
  --navy-1:#13243b;         /* 次夜空 */
  --star:#f5e6c8;           /* 星点暖白 */
  --paper:#f5ecd7;          /* 信纸米白 */
  --paper-2:#faf4e6;        /* 信纸亮 */
  --rose:#e8a0a8;           /* 玫瑰粉（强调） */
  --wheat:#e6c468;          /* 麦田金（强调） */
  --ink-on-dark:#e8ebf2;    /* 深底文字浅灰白 */
  --ink-on-paper:#1c2b40;   /* 浅底文字墨蓝 */
  --muted:#9aa8c2;

  /* 字体规范 */
  --kai:'LXGW WenKai','Songti SC','STSong',serif;          /* 中文标题：手写温度 */
  --deco:'Cinzel Decorative','Georgia',serif;              /* 哥特编号点缀 */
  --sans:'PingFang SC','Microsoft YaHei',system-ui,sans-serif; /* 正文兜底 */

  --ease:cubic-bezier(.2,.8,.3,1);
  --section-gap:96px;      /* 板块垂直间距 ≥80px */
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
html,body{margin:0;}
body{
  background:var(--navy-0);
  color:var(--ink-on-dark);
  font-family:var(--sans);
  font-size:16px;line-height:1.8;   /* 中文行高 1.8 */
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
img{max-width:100%;}
:focus-visible{outline:2px solid var(--wheat);outline-offset:3px;border-radius:4px;}

/* ============================================================
   1. 常驻顶部导航
   ============================================================ */
.site-header{
  position:fixed;top:0;left:0;right:0;z-index:60;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  background:rgba(13,27,42,.72);
  border-bottom:1px solid rgba(245,230,200,.10);
}
.nav-wrap{
  max-width:1180px;margin:0 auto;padding:0 24px;
  height:60px;display:flex;align-items:center;justify-content:flex-end;gap:8px;
}
.nav-links{display:flex;gap:6px;list-style:none;margin:0 0 0 auto;padding:0;}
.nav-links a{
  display:block;padding:7px 14px;border-radius:999px;
  font-size:.86rem;letter-spacing:.08em;color:var(--ink-on-dark);
  text-decoration:none;opacity:.82;
  transition:opacity .25s,background-color .25s;
}
.nav-links a:hover{opacity:1;background:rgba(245,230,200,.10);}
.nav-links a.active{opacity:1;color:var(--wheat);background:rgba(230,196,104,.10);}
.nav-toggle{
  display:none;background:none;border:1px solid rgba(245,230,200,.25);
  border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--star);
}
/* 转场音效开关 */
.sfx-toggle{
  display:flex;align-items:center;justify-content:center;flex:none;
  width:34px;height:34px;margin-left:10px;
  background:none;border:1px solid rgba(245,230,200,.22);border-radius:999px;
  color:var(--star);opacity:.8;cursor:pointer;
  transition:opacity .25s,border-color .25s,background-color .25s;
}
.sfx-toggle:hover,.sfx-toggle:focus-visible{
  opacity:1;border-color:rgba(245,230,200,.42);background:rgba(245,230,200,.08);
}
.sfx-toggle .slash{opacity:0;transition:opacity .2s;}
.sfx-toggle.muted{opacity:.55;}
.sfx-toggle.muted .wave{opacity:0;}
.sfx-toggle.muted .slash{opacity:1;}
@media (max-width:760px){
  .nav-toggle{display:block;}
  .nav-links{
    position:absolute;top:60px;right:12px;flex-direction:column;
    background:rgba(13,27,42,.97);border:1px solid rgba(245,230,200,.14);
    border-radius:14px;padding:10px;min-width:150px;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    display:none;
  }
  .nav-links.open{display:flex;}
}

/* ============================================================
   2. 背景层：底图 / 星空画布 / 暗角
   ============================================================ */
#bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url('bg.jpg') center 40% / cover no-repeat;
  filter:brightness(1.17) saturate(1.08) contrast(1.02);
  transform:scale(1.05);transform-origin:50% 42%;
  animation:bgBreath 44s ease-in-out infinite alternate;
  will-change:transform;
}
/* 银河流动：同图叠一层随呼吸缓慢旋进的星云，让画面里的银河真的在转 */
.galaxy-live{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:url('bg.jpg') center 40% / cover no-repeat;
  opacity:.4;mix-blend-mode:screen;
  -webkit-mask-image:radial-gradient(ellipse 54% 46% at 50% 42%,#000 0%,rgba(0,0,0,.62) 52%,transparent 78%);
  mask-image:radial-gradient(ellipse 54% 46% at 50% 42%,#000 0%,rgba(0,0,0,.62) 52%,transparent 78%);
  animation:galaxySwirl 28s ease-in-out infinite alternate;
  will-change:transform;
}
/* 星云光带：极缓的极光式环流，混合模式叠加 */
.galaxy-flow{
  position:fixed;left:50%;top:40%;width:118vmax;height:118vmax;
  margin:-59vmax 0 0 -59vmax;z-index:0;border-radius:50%;pointer-events:none;
  background:conic-gradient(from 0deg,
    transparent 0deg, rgba(130,170,225,.16) 42deg, rgba(246,220,160,.13) 96deg,
    transparent 150deg, rgba(190,150,210,.13) 218deg, rgba(150,200,235,.10) 266deg, transparent 320deg);
  filter:blur(30px);opacity:.5;mix-blend-mode:screen;
  animation:galaxySpin 72s linear infinite;
  will-change:transform;transform:translateZ(0);
}
.galaxy-flow.b{
  width:88vmax;height:88vmax;margin:-44vmax 0 0 -44vmax;top:50%;
  background:conic-gradient(from 180deg,
    transparent 0deg, rgba(232,160,168,.12) 70deg, transparent 130deg,
    rgba(246,220,160,.11) 210deg, transparent 300deg);
  filter:blur(42px);opacity:.38;
  animation:galaxySpin 118s linear infinite reverse;
  transform:translateZ(0);
}
@keyframes bgBreath{
  0%{transform:scale(1.05) rotate(-.25deg) translate3d(-.6%,.4%,0);}
  100%{transform:scale(1.13) rotate(.25deg) translate3d(.6%,-.4%,0);}
}
@keyframes galaxySwirl{
  0%{transform:scale(1.04) rotate(-1.1deg);}
  100%{transform:scale(1.16) rotate(1.1deg);}
}
@keyframes galaxySpin{to{rotate:360deg;}}
@media (prefers-reduced-motion:reduce){
  #bg,.galaxy-live,.galaxy-flow{animation:none;}
}
#sky{position:fixed;inset:0;z-index:1;pointer-events:none;}
.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(circle at 50% 34%, transparent 44%, rgba(9,18,32,.55) 100%),
    linear-gradient(180deg, rgba(9,18,32,.30), transparent 22%);
}
/* 板块内容背后整体压一层，保证阅读对比度（WCAG AA） */
.read-veil{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,
    rgba(13,27,42,.30) 0%, rgba(13,27,42,.55) 30%,
    rgba(13,27,42,.62) 60%, rgba(13,27,42,.66) 100%);
}

/* ============================================================
   3. 首页 / B-612 星球
   ============================================================ */
.hero{
  position:relative;z-index:5;min-height:100vh;min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:110px 24px 90px;text-align:center;
}
.hero-inner{max-width:760px;position:relative;}
.hero .planet-tag{
  font-family:var(--deco);font-size:.78rem;letter-spacing:.42em;
  color:var(--wheat);opacity:.85;margin-bottom:22px;
}
.hero h1{
  font-family:var(--kai);font-weight:400;
  font-size:clamp(3rem,9vw,5.4rem);
  letter-spacing:.16em;margin:0 0 6px;color:var(--star);
  text-shadow:0 0 34px rgba(245,230,200,.22);
}
.hero .pinyin{
  font-family:var(--deco);font-size:clamp(1.35rem,3.4vw,1.75rem);
  letter-spacing:.4em;color:#c9d4e6;margin-bottom:24px;
  text-shadow:0 0 22px rgba(245,230,200,.18);
}
.hero .slogan{
  font-family:var(--kai);font-size:clamp(1.05rem,2.6vw,1.32rem);
  line-height:2;color:var(--ink-on-dark);
  margin:0 auto 26px;max-width:34em;
}
.hero .tags{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:44px;}
.hero .tags span{
  font-family:var(--kai);font-size:.96rem;letter-spacing:.22em;padding:8px 28px;border-radius:999px;
  border:1px solid rgba(245,230,200,.28);color:var(--star);
  background:rgba(245,230,200,.06);
}
.portal-btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--kai);font-size:1rem;letter-spacing:.2em;
  color:var(--navy-0);text-decoration:none;
  background:linear-gradient(135deg,var(--star),var(--wheat));
  padding:13px 34px;border-radius:999px;
  box-shadow:0 8px 30px rgba(230,196,104,.30);
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.portal-btn:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(230,196,104,.42);}

/* —— 星球视图：一次只开一颗星球，进入方式只有点星，不再瀑布流下滑 —— */
.section,.site-footer{display:none;}
.section.on,.site-footer.on{display:block;animation:viewIn .55s var(--ease) both;}
body.planet-view .hero{display:none;}
@keyframes viewIn{0%{opacity:0;transform:translateY(16px);}100%{opacity:1;transform:none;}}
.back-sky{
  position:fixed;left:22px;bottom:22px;z-index:70;
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(245,230,200,.28);background:rgba(13,27,42,.78);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:var(--star);font-family:var(--kai);font-size:.92rem;letter-spacing:.12em;
  transition:background .25s,transform .25s;
}
.back-sky:hover{background:rgba(245,230,200,.14);transform:translateY(-2px);}
.back-sky[hidden]{display:none;}

/* 小王子抠图：英雄区左侧意境 */
.prince-cut{
  position:absolute;left:max(1vw,-10px);bottom:6vh;z-index:-1;
  width:min(30vw,360px);height:auto;pointer-events:none;
  filter:saturate(.95) brightness(1.05) drop-shadow(0 14px 30px rgba(2,6,22,.55));
  opacity:.96;
}
@media (max-width:900px){.prince-cut{width:42vw;opacity:.5;left:-4vw;}}

/* —— 五颗金色许愿星（用户创意核心）：手绘水彩金星，按序对应五个板块 —— */
.sky-star{
  position:absolute;z-index:6;border:0;background:none;cursor:pointer;
  width:98px;height:126px;padding:0;
  /* 入场：缩放+旋转弹入（--ed 错峰），落定后缓慢浮动 */
  animation:
    starIn .9s var(--ease) var(--ed,1s) both,
    starFloat 5.2s ease-in-out calc(var(--ed,1s) + .9s) infinite;
}
/* 星辉光晕（独立图层做呼吸，避免动 filter 触发重绘开销） */
.sky-star .s-glow{
  position:absolute;left:50%;top:40px;width:122px;height:122px;
  transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(240,207,126,.5) 0%,rgba(240,207,126,.14) 45%,transparent 70%);
  animation:starTwinkle 3.4s ease-in-out calc(var(--ed,1s) + .9s) infinite;
}
.sky-star .s-star{
  position:absolute;left:50%;top:40px;width:74px;height:74px;
  transform:translate(-50%,-50%);
  filter:drop-shadow(0 0 10px rgba(240,207,126,.55));
  pointer-events:none;
}
.sky-star .m-label{
  position:absolute;top:84px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--kai);font-size:.95rem;letter-spacing:.18em;color:var(--star);
  opacity:.55;transition:opacity .3s;
  text-shadow:0 1px 8px rgba(9,17,30,.9);
}
/* 五颗星从左到右依次点亮：关于我 / 能力 / 经历与成绩 / 作品 / 联系 */
.sky-star.s1{left:7%;  top:21%;--ed:.9s;}
.sky-star.s2{left:26%; top:10%;--ed:1.5s;}
.sky-star.s3{left:45%; top:7%; --ed:2.1s;}
.sky-star.s4{left:64%; top:11%;--ed:2.7s;}
.sky-star.s5{left:82%; top:21%;--ed:3.3s;}

/* 入场：像被点亮一样弹出来 */
@keyframes starIn{
  0%{opacity:0;scale:.2;rotate:-40deg;}
  55%{opacity:1;scale:1.18;}
  100%{opacity:1;scale:1;rotate:0deg;}
}
@keyframes starFloat{0%,100%{translate:0 0;}50%{translate:0 -7px;}}
@keyframes starTwinkle{0%,100%{opacity:.55;}50%{opacity:1;}}

/* 悬停：星星放大 + 星辉变亮 + 标签浮现 */
.sky-star:hover,.sky-star:focus-visible{scale:1.14;}
.sky-star:hover .s-glow,.sky-star:focus-visible .s-glow{opacity:1;}
.sky-star:hover .m-label,.sky-star:focus-visible .m-label{opacity:1;}
/* 点击起飞：被选中的星星先亮一下，再收进坠落的那颗流星里 */
.sky-star.launch .s-star{animation:starLaunch .55s cubic-bezier(.4,.1,.6,1) both;}
.sky-star.launch .s-glow{animation:starLaunchGlow .55s ease-out both;}
@keyframes starLaunch{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1;}
  30%{transform:translate(-50%,-50%) scale(1.38) rotate(14deg);opacity:1;}
  100%{transform:translate(-50%,-50%) scale(.08) rotate(70deg);opacity:0;}
}
@keyframes starLaunchGlow{
  0%{opacity:.8;transform:translate(-50%,-50%) scale(1);}
  35%{opacity:1;transform:translate(-50%,-50%) scale(1.5);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(.4);}
}
@media (max-width:760px){
  .sky-star{width:74px;height:100px;}
  .sky-star .s-star{width:54px;height:54px;top:30px;}
  .sky-star .s-glow{width:88px;height:88px;top:30px;}
  .sky-star .m-label{top:64px;font-size:.8rem;opacity:1;} /* 移动端常显标签，保证可达 */
  .sky-star.s1{left:2%; top:9%;}
  .sky-star.s2{left:32%;top:5%;}
  .sky-star.s3{left:62%;top:10%;}
  .sky-star.s4{left:5%;top:18%;}
  .sky-star.s5{left:61%;top:18%;}
}

/* ============================================================
   4. 坠落转场：一颗油画星坠向信息区，约 1 秒落地
   ============================================================ */
#meteor-transition{
  position:fixed;inset:0;z-index:90;
  background:rgba(9,17,30,.86);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transition:opacity .28s ease;
}
#meteor-transition.on{opacity:1;}
#meteor-transition[hidden]{display:none;}

/* 坠落体：一个零尺寸定位点，内部所有部件相对它摆放（头在 0,0） */
.t-meteor{
  position:absolute;left:50%;top:0;width:0;height:0;opacity:0;
  transform-origin:0 0;will-change:transform;
}
/* 油画笔触拖尾：三层叠出"颜料被拉长"的笔势，越远端越淡越散 */
.tm-tail{
  position:absolute;right:0;top:0;width:var(--tlen,250px);height:26px;
  margin-top:-13px;
  /* 用独立的 rotate 属性绕"星体所在点"旋转；布局用 right:0 把尾端钉在原点，
     避免 translate 与 rotate 互相干扰 */
  transform-origin:100% 50%;rotate:var(--fr,30deg);
  background:linear-gradient(90deg,transparent 0%,rgba(240,207,126,.06) 20%,rgba(255,224,150,.24) 50%,rgba(255,232,176,.56) 80%,rgba(255,242,206,.80) 100%);
  /* 双层遮罩：椭圆定形 + 右端淡出，让尾巴自然收束、边缘羽化，避免硬边纸条 */
  -webkit-mask-image:
    radial-gradient(ellipse 92% 62% at 100% 50%, #000 0%, rgba(0,0,0,.66) 46%, transparent 94%),
    linear-gradient(90deg, #000 0%, #000 74%, transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    radial-gradient(ellipse 92% 62% at 100% 50%, #000 0%, rgba(0,0,0,.66) 46%, transparent 94%),
    linear-gradient(90deg, #000 0%, #000 74%, transparent 100%);
  mask-composite:intersect;
  filter:blur(2.4px);
  opacity:0;
}
.tm-tail.b{
  height:12px;width:calc(var(--tlen,250px) * .66);margin-top:-6px;
  background:linear-gradient(90deg,transparent 0%,rgba(255,232,170,.18) 42%,rgba(255,250,232,.72) 100%);
  -webkit-mask-image:
    radial-gradient(ellipse 88% 58% at 100% 50%, #000 0%, rgba(0,0,0,.6) 44%, transparent 92%),
    linear-gradient(90deg, #000 0%, #000 70%, transparent 100%);
  -webkit-mask-composite:source-in;
  mask-image:
    radial-gradient(ellipse 88% 58% at 100% 50%, #000 0%, rgba(0,0,0,.6) 44%, transparent 92%),
    linear-gradient(90deg, #000 0%, #000 70%, transparent 100%);
  mask-composite:intersect;
  filter:blur(1.1px);
  opacity:0;
}
/* 星体本身：油画星 + 暖光圈 */
.tm-head{
  position:absolute;left:0;top:0;width:46px;height:46px;
  transform:translate(-50%,-50%) rotate(0deg);
}
.tm-head svg{display:block;width:100%;height:100%;
  filter:drop-shadow(0 0 12px rgba(255,222,150,.9)) drop-shadow(0 0 30px rgba(230,196,104,.45));
}
/* 尾随余星：三颗逐级变小变淡，保证坠落途中每帧都有东西在动 */
.tm-spark{
  position:absolute;left:0;top:0;width:12px;height:12px;opacity:0;
  transform:translate(-50%,-50%);
}
.tm-spark svg{display:block;width:100%;height:100%;opacity:.9;}
.tm-spark.k1{width:12px;height:12px;--mx:1;}
.tm-spark.k2{width:9px;height:9px;--mx:1.7;}
.tm-spark.k3{width:6px;height:6px;--mx:2.4;}

/* —— 0.02s 起步：先亮一下（点击反馈），再按重力加速坠落 —— */
#meteor-transition.go .t-meteor{
  animation:tFall .95s cubic-bezier(.38,.02,.82,.34) .04s both;
}
@keyframes tFall{
  0%{transform:translate(var(--fx,-30vw),-12vh);opacity:0;}
  9%{opacity:1;}
  78%{opacity:1;}
  100%{transform:translate(0,66vh);opacity:1;}
}
/* 拖尾：随坠落拉长、变亮，落地前最盛 */
#meteor-transition.go .tm-tail{animation:tailGrow .9s ease-in .06s both;}
#meteor-transition.go .tm-tail.b{animation-delay:.1s;}
@keyframes tailGrow{
  0%{opacity:0;scale:.35 1;}
  20%{opacity:.55;scale:.6 1;}
  80%{opacity:1;scale:1.08 1;}
  100%{opacity:.9;scale:1 1;}
}
/* 星体自旋：像一颗真的星星翻滚着坠落 */
#meteor-transition.go .tm-head{animation:headSpin .95s linear .04s both;}
@keyframes headSpin{
  0%{transform:translate(-50%,-50%) rotate(0deg) scale(.9);}
  15%{transform:translate(-50%,-50%) rotate(30deg) scale(1.16);}
  100%{transform:translate(-50%,-50%) rotate(320deg) scale(1);}
}
/* 余星沿反向拖尾排出，越远越暗 */
#meteor-transition.go .tm-spark{animation:sparkLag .9s ease-out both;}
#meteor-transition.go .tm-spark.k1{animation-delay:.05s;}
#meteor-transition.go .tm-spark.k2{animation-delay:.11s;}
#meteor-transition.go .tm-spark.k3{animation-delay:.17s;}
@keyframes sparkLag{
  0%{opacity:0;translate:0 0;scale:.4;}
  18%{opacity:.95;scale:1;}
  100%{opacity:0;translate:calc(var(--sx,-60px) * var(--mx,1)) calc(var(--sy,-44px) * var(--mx,1));scale:.5;}
}
/* 落地：星体炸开、光点湮灭 */
#meteor-transition.boom .t-meteor{animation:tMeteorOut .22s ease-in both;}
@keyframes tMeteorOut{
  0%{opacity:1;filter:brightness(1.5);}
  100%{opacity:0;filter:brightness(2.2);}
}
/* 穿越星球：下坠途中迎面掠过又远去的两颗星球（靛蓝大行星 + 玫瑰小星） */
.t-planet{
  position:absolute;border-radius:50%;opacity:0;pointer-events:none;
}
.t-planet.p1{
  left:14%;top:34vh;width:190px;height:190px;
  background:radial-gradient(circle at 34% 30%,#33507f,#1a2c50 60%,#101c38);
  box-shadow:inset -20px -16px 44px rgba(0,0,0,.5),0 0 44px rgba(70,110,180,.28);
}
.t-planet.p2{
  right:12%;top:50vh;width:116px;height:116px;
  background:radial-gradient(circle at 36% 32%,#e8a0a8,#a85a68 62%,#5c2f3c);
  box-shadow:inset -12px -10px 30px rgba(0,0,0,.45),0 0 36px rgba(232,160,168,.32);
}
#meteor-transition.go .t-planet{animation:tPass .9s ease-in both;}
#meteor-transition.go .t-planet.p2{animation-delay:.16s;}
@keyframes tPass{
  0%{opacity:0;transform:scale(.55);}
  40%{opacity:.9;}
  100%{opacity:0;transform:scale(1.7);}
}
/* —— 穿越：落地后镜头继续冲刺，星轨拉成光带，目标星球扑面而来 —— */
.t-warp{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.t-streak{
  position:absolute;left:50%;top:55vh;width:15vmax;height:2px;margin-top:-1px;
  transform-origin:0 50%;border-radius:2px;opacity:0;
  background:linear-gradient(90deg,rgba(255,244,214,.95),rgba(255,244,214,0));
}
.t-streak.far{width:9vmax;height:1px;margin-top:-.5px;
  background:linear-gradient(90deg,rgba(255,244,214,.7),rgba(255,244,214,0));}
.t-streak.rose{background:linear-gradient(90deg,rgba(240,180,190,.85),rgba(240,180,190,0));}
#meteor-transition.warp .t-streak{animation:streakFly 1.15s cubic-bezier(.45,.05,.85,.45) var(--d,0s) both;}
@keyframes streakFly{
  0%{opacity:0;transform:rotate(var(--a)) translateX(3vmin) scaleX(.1);}
  16%{opacity:1;}
  100%{opacity:0;transform:rotate(var(--a)) translateX(72vmax) scaleX(1);}
}
/* 目标星球：从前方扑面而来，减速停在画面上半部（配色由 JS 按板块注入，取深沉色调避免压字） */
.t-dest{
  position:absolute;left:50%;top:54vh;width:38vmin;height:38vmin;border-radius:50%;
  transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;
  background:radial-gradient(circle at 34% 30%, var(--pc1,#d9b45e) 0%, var(--pc2,#6f5420) 78%);
  box-shadow:inset -4vmin -5vmin 10vmin rgba(6,12,24,.72), 0 0 10vmin rgba(245,230,200,.18);
}
/* 穿越途中的暗角：速度越快暗角越紧，抵达时松开（Fernhollow 式冲刺感） */
.t-rush{position:absolute;inset:0;pointer-events:none;opacity:0;}
#meteor-transition.warp .t-rush{animation:tRush 2s ease-in-out both;}
@keyframes tRush{
  0%{opacity:0;box-shadow:inset 0 0 18vmax 4vmax rgba(6,12,24,0);}
  45%{opacity:1;box-shadow:inset 0 0 26vmax 12vmax rgba(6,12,24,.88);}
  100%{opacity:1;box-shadow:inset 0 0 18vmax 6vmax rgba(6,12,24,.38);}
}
/* —— 穿越之门：小王子与狐狸的星球之门（抠图素材，羽化圆形）由远及近扑面而来 —— */
.t-portal{
  position:absolute;left:50%;top:54vh;width:56vmin;height:56vmin;z-index:1;
  transform:translate(-50%,-50%) scale(.2);opacity:0;pointer-events:none;
  border-radius:50%;will-change:transform,opacity,filter;
}
.t-portal img{
  width:100%;height:100%;display:block;border-radius:50%;
  filter:drop-shadow(0 0 26px rgba(246,220,160,.5));
}
.t-portal::before{
  content:'';position:absolute;inset:-7%;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(246,220,160,0),rgba(246,220,160,.45),rgba(232,160,168,.3),rgba(246,220,160,0));
  filter:blur(12px);opacity:.5;pointer-events:none;
  animation:portalRing 4s linear infinite;
}
@keyframes portalRing{to{rotate:360deg;}}
#meteor-transition.warp .t-portal{
  animation:portalOpen 2s cubic-bezier(.3,.05,.35,1) both, portalBlur 2s ease-in both;
}
#meteor-transition.warp .t-portal img{
  animation:portalSpin 2s ease-in both;
}
@keyframes portalOpen{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.18);}
  20%{opacity:1;transform:translate(-50%,-50%) scale(.96);}
  54%{opacity:1;transform:translate(-50%,-50%) scale(1.03);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.35);}
}
@keyframes portalBlur{
  0%{filter:blur(0);}
  56%{filter:blur(0);}
  100%{filter:blur(11px);}
}
@keyframes portalSpin{
  0%{rotate:-6deg;scale:1;}
  100%{rotate:14deg;scale:1.06;}
}
.t-dest::before{ /* 星球轨道环 */
  content:'';position:absolute;left:-24%;top:38%;width:148%;height:26%;
  border:1.5px solid rgba(245,230,200,.38);border-radius:50%;
  transform:rotate(-14deg);
}
.t-dest::after{ /* 大气辉光 */
  content:'';position:absolute;inset:-9%;border-radius:50%;
  background:radial-gradient(circle,transparent 58%,var(--pc1,#ffe9a8) 82%,transparent 78%);
  opacity:.35;filter:blur(6px);
}
#meteor-transition.warp .t-dest{animation:destIn 1.6s cubic-bezier(.16,.72,.24,1) .12s both;}
@keyframes destIn{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0;}
  16%{opacity:1;}
  72%{transform:translate(-50%,-50%) scale(1.05);}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1;}
}
/* 触底时随星尘一起飘散的玫瑰花瓣 */
.t-petal{
  position:absolute;left:50%;top:66vh;width:13px;height:9px;opacity:0;
  background:radial-gradient(ellipse at 30% 30%,#f3bcc2,var(--rose));
  border-radius:62% 38% 55% 45%;
}
#meteor-transition.boom .t-petal{animation:tPetal .85s ease-out var(--dl,0s) both;}
@keyframes tPetal{
  0%{transform:translate(0,0) rotate(0deg);opacity:0;}
  16%{opacity:.95;}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr,120deg));opacity:0;}
}
/* 触底闪光：一点爆开的暖白金光 */
.t-flash{
  position:absolute;left:50%;top:66vh;width:120px;height:120px;
  margin:-60px 0 0 -60px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(255,248,228,.95) 0%,rgba(245,230,200,.55) 32%,rgba(230,196,104,.18) 58%,transparent 74%);
  mix-blend-mode:screen;
}
#meteor-transition.boom .t-flash{animation:tFlash .38s ease-out both;}
@keyframes tFlash{
  0%{transform:scale(.15);opacity:1;}
  100%{transform:scale(1.5);opacity:0;}
}
/* 触底：三环涟漪错开扩散（细环+微模糊更柔） */
.t-ripple{
  position:absolute;left:50%;top:calc(66vh + 2px);width:30px;height:30px;
  margin:-15px 0 0 -15px;border-radius:50%;
  border:2px solid rgba(245,230,200,.85);opacity:0;
  filter:blur(.4px);
}
.t-ripple.r2{border-width:1.4px;border-color:rgba(230,196,104,.6);}
.t-ripple.r3{border-width:1px;border-color:rgba(232,160,168,.45);}
#meteor-transition.boom .t-ripple{animation:tRipple .58s ease-out both;}
#meteor-transition.boom .t-ripple.r2{animation-delay:.09s;}
#meteor-transition.boom .t-ripple.r3{animation-delay:.18s;}
@keyframes tRipple{
  0%{transform:scale(.2);opacity:1;}
  70%{opacity:.55;}
  100%{transform:scale(9.5);opacity:0;}
}
/* 星尘：大小/时序各异，个别加柔焦，像溅起的星屑 */
.t-dust{
  position:absolute;left:50%;top:66vh;width:var(--s,5px);height:var(--s,5px);
  margin:calc(var(--s,5px) / -2) 0 0 calc(var(--s,5px) / -2);
  border-radius:50%;background:var(--star);opacity:0;
}
.t-dust.soft{filter:blur(1.2px);}
#meteor-transition.boom .t-dust{animation:tDust .68s cubic-bezier(.16,.7,.36,1) var(--dl,0s) both;}
@keyframes tDust{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  60%{opacity:.9;}
  100%{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0;}
}
/* 信息卡片：背后先晕开一团暖光，文字再逐行淡入 */
.t-glow{
  position:absolute;left:50%;top:66vh;width:64vmin;height:34vmin;
  transform:translate(-50%,-50%) scale(.6);border-radius:50%;
  background:radial-gradient(ellipse,rgba(230,196,104,.16) 0%,rgba(230,196,104,.05) 48%,transparent 72%);
  opacity:0;mix-blend-mode:screen;pointer-events:none;
}
#meteor-transition.card-in .t-glow{
  transform:translate(-50%,-50%) scale(1);opacity:1;
  transition:transform .7s var(--ease),opacity .6s ease;
}
.t-card{
  position:absolute;left:50%;top:75vh;transform:translate(-50%,-50%) translateY(26px);
  text-align:center;opacity:0;max-width:86vw;z-index:2;padding:0 8px;
}
/* 卡片身后的暗色衬底：保证文字不被星球或星空吃掉 */
.t-card::before{
  content:'';position:absolute;left:50%;top:50%;z-index:-1;
  width:170%;height:210%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse,rgba(9,17,30,.86) 0%,rgba(9,17,30,.56) 52%,transparent 76%);
  filter:blur(5px);pointer-events:none;
}
#meteor-transition.card-in .t-card{
  transform:translate(-50%,-50%) translateY(0);opacity:1;
  transition:transform .5s var(--ease),opacity .5s ease;
}
/* 卡片上方的线稿玫瑰：随卡片一同绽放 */
.t-rose{
  display:block;width:46px;height:46px;margin:0 auto 14px;
  opacity:0;transform:scale(.5) rotate(-14deg);
  filter:drop-shadow(0 0 10px rgba(232,160,168,.45));
}
#meteor-transition.card-in .t-rose{animation:tRoseIn .6s var(--ease) .06s both;}
@keyframes tRoseIn{
  0%{opacity:0;transform:scale(.5) rotate(-14deg);}
  100%{opacity:1;transform:scale(1) rotate(0deg);}
}
.t-card .t-quote{
  font-family:var(--kai);font-size:clamp(1.04rem,2.6vw,1.3rem);
  color:#f4dc9f;line-height:1.75;letter-spacing:.08em;margin:0 0 12px;
  text-shadow:0 1px 12px rgba(9,17,30,.98),0 0 4px rgba(9,17,30,.9);
}
.t-card .t-title{
  font-family:var(--kai);font-weight:400;font-size:clamp(1.9rem,5.2vw,2.9rem);
  letter-spacing:.18em;color:#fdf2da;margin:0;line-height:1.25;
  text-shadow:0 2px 20px rgba(9,17,30,.98),0 0 8px rgba(9,17,30,.85);
}
/* 逐行淡入：引言先行，标题稍候，金线最后扫入 */
#meteor-transition.card-in .t-card .t-quote,
#meteor-transition.card-in .t-card .t-title,
#meteor-transition.card-in .t-card .t-line{
  animation:tLineIn .55s var(--ease) both;
}
#meteor-transition.card-in .t-card .t-title{animation-delay:.14s;}
#meteor-transition.card-in .t-card .t-line{animation-delay:.3s;}
@keyframes tLineIn{
  0%{opacity:0;transform:translateY(10px);}
  100%{opacity:1;transform:none;}
}
.t-line{
  width:72px;height:2px;margin:18px auto 0;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--wheat),transparent);
  transform-origin:center;
}
#meteor-transition.card-in .t-card .t-line{
  animation-name:tLineIn,tLineGrow;
  animation-duration:.55s,.6s;
  animation-delay:.3s,.3s;
  animation-fill-mode:both,both;
  animation-timing-function:var(--ease),ease-out;
}
@keyframes tLineGrow{
  0%{transform:scaleX(0);}
  100%{transform:scaleX(1);}
}
.t-skip{
  position:absolute;top:18px;right:20px;z-index:2;
  background:rgba(245,230,200,.08);border:1px solid rgba(245,230,200,.3);
  color:var(--ink-on-dark);border-radius:999px;padding:7px 18px;
  font-size:.84rem;letter-spacing:.14em;cursor:pointer;font-family:var(--sans);
}
.t-skip:hover{background:rgba(245,230,200,.16);}

/* ============================================================
   5. 内容板块公共
   ============================================================ */
main{position:relative;z-index:5;}
.section{
  max-width:980px;margin:0 auto;
  padding:var(--section-gap) 24px 0;
  scroll-margin-top:70px;
}
.section:last-of-type{padding-bottom:var(--section-gap);}
.sec-head{margin-bottom:44px;}
.sec-quote{
  font-family:var(--kai);font-size:clamp(.95rem,2.4vw,1.1rem);
  color:var(--wheat);letter-spacing:.1em;margin:0 0 12px;
}
.sec-title{
  font-family:var(--kai);font-weight:400;
  font-size:clamp(1.7rem,4.6vw,2.3rem);
  letter-spacing:.24em;color:var(--star);margin:0;
}
.sec-sub{
  font-family:var(--deco);font-size:.72rem;letter-spacing:.4em;
  color:var(--muted);margin-top:8px;text-transform:uppercase;
}
/* 板块入场（只动 transform/opacity，reduced-motion 时直接终态） */
.rise{opacity:0;transform:translateY(22px);transition:opacity .8s var(--ease),transform .8s var(--ease);}
.rise.in{opacity:1;transform:none;}

/* ============================================================
   6. 关于我（玫瑰星球）
   ============================================================ */
.about-grid{display:grid;grid-template-columns:250px 1fr;gap:44px;align-items:start;}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;}}
.fact-card{
  background:rgba(19,36,59,.72);border:1px solid rgba(245,230,200,.12);
  border-radius:18px;padding:26px 24px;
}
.fact-card dl{margin:0;}
.fact-card dt{
  font-size:.78rem;letter-spacing:.2em;color:var(--wheat);margin-bottom:2px;
}
.fact-card dd{margin:0 0 16px;font-size:.95rem;color:var(--ink-on-dark);}
.fact-card dd:last-child{margin-bottom:0;}
.about-intro p{margin:0 0 18px;font-size:.98rem;line-height:1.9;}
.about-intro p em{font-style:normal;color:var(--rose);}
.hobbies{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:34px;}
.hobby{
  display:flex;gap:14px;align-items:flex-start;
  background:rgba(19,36,59,.55);border:1px solid rgba(245,230,200,.10);
  border-radius:14px;padding:16px 18px;
  transition:transform .35s var(--ease),border-color .35s;
}
.hobby:hover{transform:translateY(-4px);border-color:rgba(232,160,168,.4);}
.hobby svg{flex:none;margin-top:3px;}
.hobby b{font-family:var(--kai);font-weight:400;letter-spacing:.12em;color:var(--star);display:block;font-size:.98rem;}
.hobby span{font-size:.82rem;color:var(--muted);line-height:1.6;}

/* ============================================================
   7. 能力（数星星的商人星球）
   ============================================================ */
.skill-groups{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:760px){.skill-groups{grid-template-columns:1fr;}}
.skill-group{
  background:rgba(19,36,59,.60);border:1px solid rgba(245,230,200,.10);
  border-radius:18px;padding:24px 26px;
}
.skill-group h3{
  font-family:var(--kai);font-weight:400;font-size:1.12rem;letter-spacing:.2em;
  color:var(--star);margin:0 0 18px;
}
.skill-item{margin-bottom:15px;}
.skill-item:last-child{margin-bottom:0;}
.skill-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
.skill-row .s-name{font-size:.92rem;color:var(--ink-on-dark);}
.skill-row .s-level{font-size:.74rem;letter-spacing:.08em;color:var(--wheat);opacity:.9;}
.skill-bar{height:3px;border-radius:3px;background:rgba(245,230,200,.12);overflow:hidden;}
.skill-bar i{
  display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,var(--wheat),var(--star));
  width:0;transition:width 1s var(--ease) .15s;
}
.rise.in .skill-bar i{width:var(--pct);}

/* ============================================================
   8. 经历与成绩（点灯人星球）
   ============================================================ */
.exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
@media (max-width:760px){.exp-grid{grid-template-columns:1fr;}}
.exp-card{
  background:rgba(19,36,59,.60);border:1px solid rgba(245,230,200,.10);
  border-radius:18px;padding:24px 26px;
}
.exp-card h3{
  font-family:var(--kai);font-weight:400;font-size:1.08rem;letter-spacing:.2em;
  color:var(--star);margin:0 0 16px;
}
.exp-card.wide{grid-column:1 / -1;}
.study-stats{display:flex;gap:26px;flex-wrap:wrap;}
.stat b{
  font-family:var(--kai);font-weight:400;font-size:1.7rem;color:var(--wheat);
  display:block;letter-spacing:.04em;
}
.stat span{font-size:.8rem;color:var(--muted);letter-spacing:.1em;}
.course-list{margin:0;padding:0;list-style:none;}
.course-list li{
  display:flex;justify-content:space-between;padding:8px 0;
  border-bottom:1px dashed rgba(245,230,200,.14);font-size:.92rem;
}
.course-list li:last-child{border-bottom:0;}
.course-list .c-score{font-family:var(--deco);color:var(--wheat);letter-spacing:.06em;}
.exp-story{
  font-size:.95rem;line-height:1.9;color:var(--ink-on-dark);margin:0;
  border-left:2px solid rgba(232,160,168,.5);padding-left:18px;
}
.honor-list{margin:0;padding:0;list-style:none;}
.honor-list li{
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
  padding:9px 0;border-bottom:1px dashed rgba(245,230,200,.14);font-size:.92rem;
}
.honor-list li:last-child{border-bottom:0;}
.honor-list .h-level{
  flex:none;font-size:.76rem;letter-spacing:.1em;color:var(--rose);
  border:1px solid rgba(232,160,168,.4);border-radius:999px;padding:2px 12px;
}
.practice-list{margin:0;padding-left:1.2em;font-size:.92rem;}
.practice-list li{margin-bottom:8px;}
.practice-list li::marker{content:'✦ ';color:var(--wheat);}

/* ============================================================
   9. 作品星球（信封墙）—— 本次重点
   ============================================================ */
.env-wall{
  display:grid;grid-template-columns:repeat(3,1fr);gap:30px;
}
@media (max-width:1080px){.env-wall{grid-template-columns:repeat(2,1fr);}}
@media (max-width:680px){.env-wall{grid-template-columns:1fr;}}
.envelope{
  position:relative;cursor:pointer;text-align:left;
  border:0;padding:0;background:none;font:inherit;color:inherit;
  perspective:900px;
  transition:transform .4s var(--ease);
}
.envelope:hover,.envelope:focus-visible{transform:translateY(-7px);}
.env-card{
  position:relative;border-radius:14px;overflow:visible;
  background:linear-gradient(160deg,var(--paper-2),var(--paper) 55%,#efe2c6);
  color:var(--ink-on-paper);
  box-shadow:0 10px 26px rgba(4,10,24,.45);
  transition:box-shadow .4s var(--ease);
  min-height:300px;display:flex;flex-direction:column;
}
.envelope:hover .env-card,.envelope:focus-visible .env-card{
  box-shadow:0 22px 44px rgba(4,10,24,.6),0 0 0 1px rgba(230,196,104,.25);
}
/* 翻盖：三角，transform-origin 顶部，3D 掀开 */
.env-flap{
  position:absolute;top:0;left:0;right:0;height:86px;z-index:4;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#efe3c8,#e4d3ae);
  border-radius:14px 14px 0 0;
  transform-origin:top center;
  transition:transform .55s var(--ease);
  box-shadow:inset 0 -8px 14px rgba(28,43,64,.10);
}
.envelope:hover .env-flap,.envelope:focus-visible .env-flap{transform:rotateX(-22deg);}
.envelope.open .env-flap{transform:rotateX(-158deg);transition-duration:.6s;}
/* 信纸（点击后滑出） */
.env-letter{
  position:absolute;left:7%;right:7%;top:10px;height:120px;z-index:3;
  background:var(--paper-2);border-radius:8px;
  box-shadow:0 4px 14px rgba(28,43,64,.18);
  padding:16px 18px;font-size:.8rem;line-height:1.7;color:var(--ink-on-paper);
  transform:translateY(0);opacity:0;
  transition:transform .55s var(--ease) .18s,opacity .4s ease .18s;
}
.envelope.open .env-letter{transform:translateY(-46%);opacity:1;}
.env-letter .l-title{font-family:var(--kai);letter-spacing:.14em;display:block;margin-bottom:6px;}
/* 蜡封 */
.env-wax{
  position:absolute;left:50%;top:64px;z-index:5;width:44px;height:44px;
  transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#f0b6bc,var(--rose) 55%,#c77f88);
  box-shadow:0 3px 10px rgba(120,60,66,.45),inset 0 0 0 3px rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--kai);color:#fff3f4;font-size:1.15rem;
  transition:box-shadow .35s,opacity .4s;
}
.envelope:hover .env-wax,.envelope:focus-visible .env-wax{
  box-shadow:0 3px 14px rgba(120,60,66,.5),0 0 18px rgba(232,160,168,.75),inset 0 0 0 3px rgba(255,255,255,.2);
}
.envelope.open .env-wax{opacity:0;}
/* 封面信息（不打开也看得清） */
.env-body{padding:104px 22px 20px;display:flex;flex-direction:column;flex:1;position:relative;z-index:2;}
.env-no{
  position:absolute;top:18px;left:20px;z-index:2;
  font-family:var(--deco);font-size:1.05rem;letter-spacing:.14em;color:#8a7448;
}
.env-status{
  position:absolute;top:16px;right:16px;z-index:2;
  font-size:.68rem;letter-spacing:.14em;border-radius:999px;padding:3px 11px;
  border:1px solid;
}
.st-doing{color:#8a6a1f;border-color:rgba(160,120,40,.5);background:rgba(230,196,104,.22);}
.st-done{color:#3c6e51;border-color:rgba(80,140,105,.5);background:rgba(140,190,160,.22);}
.st-design{color:#7a5c80;border-color:rgba(150,110,160,.5);background:rgba(190,150,200,.22);}
.env-name{
  font-family:var(--kai);font-weight:400;
  font-size:clamp(1.4rem,2.6vw,1.65rem);letter-spacing:.12em;
  margin:0 0 8px;color:var(--ink-on-paper);
}
.env-brief{font-size:.86rem;line-height:1.7;color:#4a5a72;margin:0 0 14px;flex:1;}
.env-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.env-tags{display:flex;gap:6px;flex-wrap:wrap;}
.env-tags span{
  font-size:.68rem;letter-spacing:.06em;padding:2px 10px;border-radius:999px;
  background:rgba(28,43,64,.08);color:#41506a;border:1px solid rgba(28,43,64,.10);
}
.env-cta{font-size:.76rem;letter-spacing:.14em;color:#8a7448;white-space:nowrap;}

/* ============================================================
   10. 联系 / 页脚
   ============================================================ */
.site-footer{
  position:relative;z-index:5;
  border-top:1px solid rgba(245,230,200,.10);

}
.contact-grid{

.contact-item .c-label{

.contact-item a{color:var(--ink-on-dark);text-decoration:none;border-bottom:1px dashed rgba(245,230,200,.4);}
.contact-item a:hover{color:var(--wheat);}
.wechat-qr{

/* ============================================================
   11. 动效降级：prefers-reduced-motion 直接显示终态
   ============================================================ */
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto;}
  *,*::before,*::after{animation:none !important;transition:none !important;}
  .rise{opacity:1;transform:none;}
  .skill-bar i{width:var(--pct);}

}

<!-- 全站共用的油画质感金色五角星（首页许愿星 + 转场坠落星的母版） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 厚涂底色：左上暖白高光 → 右下暗金，模拟颜料的堆叠 -->
    <radialGradient id="goldStarGrad" cx="38%" cy="30%" r="84%">
      <stop offset="0%" stop-color="#fff2c6"/>
      <stop offset="36%" stop-color="#f2d68c"/>
      <stop offset="70%" stop-color="#e2bd6a"/>
      <stop offset="100%" stop-color="#c6963f"/>
    </radialGradient>
    <!-- 油面罩染：亮部更亮、暗部更深，做出油画特有的透明层 -->
    <linearGradient id="goldStarSheen" x1="10%" y1="4%" x2="88%" y2="96%">
      <stop offset="0%" stop-color="#fffbe9" stop-opacity=".88"/>
      <stop offset="30%" stop-color="#fff2c4" stop-opacity=".26"/>
      <stop offset="56%" stop-color="#e9c473" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a97b32" stop-opacity=".45"/>
    </linearGradient>
    <!-- 略微不规则的五角星：边缘本来就带手绘抖动 -->
    <path id="goldStar" d="M50 4 C53 20 57 30 62 35 C74 36 88 38 95 42 C87 51 76 57 70 62 C73 74 77 87 75 94 C67 86 58 80 51 75 C43 81 33 88 25 91 C28 80 31 69 31 61 C23 55 13 50 6 44 C17 40 30 38 38 35 C42 25 46 12 50 4 Z"/>
    <!-- 笔触抖动：用噪声位移把边缘推成画笔勾线的毛边 -->
    <filter id="oilEdge" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.048" numOctaves="3" seed="12" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="6.5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.75"/>
    </filter>
    <!-- 颜料颗粒：叠在星形内部，去掉纯色塑料感 -->
    <filter id="oilGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="4" seed="5"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <clipPath id="goldStarClip"><use href="#goldStar"/></clipPath>

    <!-- 合成一颗油画星：底稿 + 罩染 + 颗粒 -->
    <g id="oilStar">
      <g filter="url(#oilEdge)">
        <use href="#goldStar" fill="url(#goldStarGrad)"/>
        <use href="#goldStar" fill="url(#goldStarSheen)"/>
      </g>
      <g clip-path="url(#goldStarClip)" opacity=".26" style="mix-blend-mode:multiply">
        <rect x="0" y="0" width="100" height="100" filter="url(#oilGrain)"/>
      </g>
    </g>
  </defs>
</svg>

<script>
(function(){
'use strict';
var D = window.SITE_DATA;
var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var $ = function(id){ return document.getElementById(id); };

/* ============================================================
   一、内容渲染（数据全部来自 data.js，改文案不碰结构）
   ============================================================ */
// 导航
$('navLinks').innerHTML = D.nav.map(function(n){
  return '<li><a href="#' + n.key + '" data-nav="' + n.key + '">' + n.label + '</a></li>';
}).join('');

// 首页
$('heroName').textContent   = D.home.name.split('').join(' ');
$('heroPinyin').textContent = D.home.nameEn;
$('heroSlogan').textContent = D.home.slogan;
$('heroTags').innerHTML = D.home.tags.map(function(t){ return '<span>' + t + '</span>'; }).join('');

// 首页五颗金色许愿星：按 data 顺序依次编号 s1..s5
$('skyMeteors').innerHTML = D.home.meteors.map(function(m, i){
  return '<button type="button" class="sky-star s' + (i + 1) + '" data-target="' + m.key + '"' +
    ' aria-label="乘许愿星前往：' + m.label + '">' +
    '<span class="s-glow" aria-hidden="true"></span>' +
    '<svg class="s-star" viewBox="0 0 100 100" aria-hidden="true"><use href="#oilStar"/></svg>' +
    '<span class="m-label">' + m.label + '</span></button>';
}).join('');

/* 星星登场铃音：浏览器要求先有一次交互才允许出声，
   因此在第一次轻触页面后，为尚未登场的星星补上各自的音 */
var userGestured = false;
window.addEventListener('pointerdown', function(){ userGestured = true; }, { once:true, capture:true });
window.addEventListener('keydown',     function(){ userGestured = true; }, { once:true, capture:true });
var starChimeTimes = [.9, 1.5, 2.1, 2.7, 3.3];  // 与 .sky-star.s1..s5 的 --ed 一致
starChimeTimes.forEach(function(t, i){
  setTimeout(function(){
    if (userGestured && !reduceMotion) sfxStarChime(i);
  }, (t + 0.4) * 1000);
});

// 关于我
$('aboutQuote').textContent = D.about.quote;
$('factList').innerHTML = D.about.facts.map(function(f){
  return '<dt>' + f.k + '</dt><dd>' + f.v + '</dd>';
}).join('');
$('aboutIntro').innerHTML = D.about.intro.map(function(p){ return '<p>' + p + '</p>'; }).join('');
// 爱好小图标（inline SVG，手绘线条感）
var hobbyIcons = {
  pot:  '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e8a0a8" stroke-width="1.4" aria-hidden="true"><path d="M4 10h16v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4v-6z"/><path d="M2 10h20M9 6c1-1.5 3-1.5 4 0M12 3v2"/></svg>',
  music:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e6c468" stroke-width="1.4" aria-hidden="true"><path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.4"/><circle cx="17" cy="16" r="2.4"/></svg>',
  leaf: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8fc4a0" stroke-width="1.4" aria-hidden="true"><path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15z"/><path d="M5 19c3-5 7-9 11-11"/></svg>',
  tile: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9aa8c2" stroke-width="1.4" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M12 7l1.2 2.4L15.6 10l-2.4.6L12 13l-1.2-2.4L8.4 10l2.4-.6z"/></svg>'
};
$('hobbyList').innerHTML = D.about.hobbies.map(function(h){
  return '<div class="hobby">' + (hobbyIcons[h.icon] || '') +
    '<div><b>' + h.name + '</b><span>' + h.desc + '</span></div></div>';
}).join('');

// 能力
$('skillsQuote').textContent = D.skills.quote;
$('skillGroups').innerHTML = D.skills.groups.map(function(g){
  return '<section class="skill-group"><h3>' + g.title + '</h3>' + g.items.map(function(it){
    return '<div class="skill-item"><div class="skill-row">' +
      '<span class="s-name">' + it.name + '</span>' +
      '<span class="s-level">' + it.level + '</span></div>' +
      '<div class="skill-bar"><i style="--pct:' + it.pct + '%"></i></div></div>';
  }).join('') + '</section>';
}).join('');

// 经历与成绩
$('expQuote').textContent = D.experience.quote;
$('studyStats').innerHTML = D.experience.study.map(function(s){
  return '<div class="stat"><b>' + s.v + '</b><span>' + s.k + '</span></div>';
}).join('');
$('courseList').innerHTML = D.experience.courses.map(function(c){
  return '<li><span>' + c.name + '</span><span class="c-score">' + c.score + '</span></li>';
}).join('');

/* ============================================================
   四、转场音效：Web Audio 现场合成（不引入外部音频文件）
   ============================================================ */
var SFX_KEY = 'luojiao-sfx';
var sfxOn = localStorage.getItem(SFX_KEY) !== 'off';
var actx = null, sfxMaster = null, whooshSrc = null, whooshGain = null;

function sfxEnsure(){
  if (!sfxOn) return null;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!actx) {
    actx = new AC();
    sfxMaster = actx.createGain();
    sfxMaster.gain.value = 0.32;   // 整体音量克制，不抢内容
    sfxMaster.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function sfxNoise(dur){
  var n = Math.floor(actx.sampleRate * dur);
  var buf = actx.createBuffer(1, n, actx.sampleRate);
  var d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
/* 坠落风声：带通噪声从低到高再回落，贴着 0.95s 的坠落 */
function sfxWhoosh(){
  var ac = sfxEnsure(); if (!ac) return;
  sfxStopWhoosh();
  var t0 = ac.currentTime + 0.02, dur = 0.95;
  var src = ac.createBufferSource(); src.buffer = sfxNoise(dur);
  var bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(240, t0);
  bp.frequency.exponentialRampToValueAtTime(1250, t0 + dur * 0.72);
  bp.frequency.exponentialRampToValueAtTime(520, t0 + dur);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.45, t0 + dur * 0.55);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(bp); bp.connect(g); g.connect(sfxMaster);
  src.start(t0); src.stop(t0 + dur);
  whooshSrc = src; whooshGain = g;
}
function sfxStopWhoosh(){
  if (!whooshSrc) return;
  try {
    if (actx && whooshGain) {
      var now = actx.currentTime;
      whooshGain.gain.cancelScheduledValues(now);
      whooshGain.gain.setValueAtTime(Math.max(whooshGain.gain.value, 0.0001), now);
      whooshGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.1);
    }
    whooshSrc.stop(actx ? actx.currentTime + 0.14 : 0);
  } catch(e){}
  whooshSrc = null; whooshGain = null;
}
/* 落地：一声低沉的落点 + 三枚上行的星尘铃音 + 一点细沙 */
function sfxImpact(){
  var ac = sfxEnsure(); if (!ac) return;
  var t0 = ac.currentTime + 0.01;

  var thump = ac.createOscillator(); thump.type = 'sine';
  thump.frequency.setValueAtTime(120, t0);
  thump.frequency.exponentialRampToValueAtTime(54, t0 + 0.3);
  var tg = ac.createGain();
  tg.gain.setValueAtTime(0.4, t0);
  tg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.36);
  thump.connect(tg); tg.connect(sfxMaster);
  thump.start(t0); thump.stop(t0 + 0.4);

  [[784, 0, 0.3], [1176, .06, 0.22], [1568, .12, 0.13]].forEach(function(p){
    var o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = p[0];
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0 + p[1]);
    g.gain.linearRampToValueAtTime(p[2], t0 + p[1] + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.55);
    o.connect(g); g.connect(sfxMaster);
    o.start(t0 + p[1]); o.stop(t0 + 0.6);
  });

  var src = ac.createBufferSource(); src.buffer = sfxNoise(0.2);
  var hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2600;
  var hg = ac.createGain();
  hg.gain.setValueAtTime(0.1, t0 + 0.02);
  hg.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
  src.connect(hp); hp.connect(hg); hg.connect(sfxMaster);
  src.start(t0 + 0.02); src.stop(t0 + 0.24);
}
/* 星星登场铃音：五声音阶一颗星一个音，基音 + 很轻的高八度泛音，温暖不刺耳 */
var starNotes = [523.25, 587.33, 659.25, 783.99, 880.0];  // C5 D5 E5 G5 A5
function sfxStarChime(i){
  var ac = sfxEnsure(); if (!ac) return;
  var t0 = ac.currentTime + 0.01, f = starNotes[i % starNotes.length];
  [f, f * 2].forEach(function(fr, k){
    var o = ac.createOscillator(); o.type = k ? 'sine' : 'triangle'; o.frequency.value = fr;
    var g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(k ? 0.05 : 0.16, t0 + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
    o.connect(g); g.connect(sfxMaster);
    o.start(t0); o.stop(t0 + 0.95);
  });
}
/* 穿越推进：两枚微失谐锯齿波过低通，滤波从"闷"扫到"亮"，像掠过星球表面的风 */
var warpNodes = null;
function sfxWarp(){
  var ac = sfxEnsure(); if (!ac) return;
  sfxStopWarp();
  var t0 = ac.currentTime + 0.01, dur = 2.0;
  var o1 = ac.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 98;
  var o2 = ac.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = 98 * 1.008;
  var lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 1.1;
  lp.frequency.setValueAtTime(220, t0);
  lp.frequency.exponentialRampToValueAtTime(2400, t0 + dur * 0.8);
  var g = ac.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.11, t0 + dur * 0.5);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o1.connect(lp); o2.connect(lp); lp.connect(g); g.connect(sfxMaster);
  o1.start(t0); o2.start(t0); o1.stop(t0 + dur); o2.stop(t0 + dur);
  warpNodes = { osc:[o1, o2], gain:g };
}
function sfxStopWarp(){
  if (!warpNodes || !actx) return;
  try {
    var now = actx.currentTime;
    warpNodes.gain.gain.cancelScheduledValues(now);
    warpNodes.gain.gain.setValueAtTime(Math.max(warpNodes.gain.gain.value, 0.0001), now);
    warpNodes.gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
    warpNodes.osc.forEach(function(o){ o.stop(now + 0.16); });
  } catch(e){}
  warpNodes = null;
}
/* 抵达星球：温暖的大三和弦轻轻落定（C-E-G-C 依次进入） */
function sfxLand(){
  var ac = sfxEnsure(); if (!ac) return;
  var t0 = ac.currentTime + 0.01;
  [[261.63, .1], [329.63, .08], [392.0, .08], [523.25, .05]].forEach(function(p, i){
    var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = p[0];
    var g = ac.createGain();
    var a = t0 + i * 0.05;
    g.gain.setValueAtTime(0.0001, a);
    g.gain.linearRampToValueAtTime(p[1], a + 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, a + 1.3);
    o.connect(g); g.connect(sfxMaster);
    o.start(a); o.stop(a + 1.35);
  });
}
/* 音效开关：记住选择，关掉时立刻静音并挂起音频上下文 */
var sfxBtn = $('sfxToggle');
function renderSfx(){
  sfxBtn.classList.toggle('muted', !sfxOn);
  sfxBtn.setAttribute('aria-pressed', sfxOn ? 'true' : 'false');
  var label = sfxOn ? '关闭转场音效' : '开启转场音效';
  sfxBtn.setAttribute('aria-label', label);
  sfxBtn.title = label;
}
renderSfx();
sfxBtn.addEventListener('click', function(){
  sfxOn = !sfxOn;
  localStorage.setItem(SFX_KEY, sfxOn ? 'on' : 'off');
  renderSfx();
  if (!sfxOn) {
    sfxStopWhoosh();
    if (actx && actx.state === 'running') actx.suspend();
  } else {
    sfxEnsure();
  }
});

/* ============================================================
   五、流星转场（坠落→炸开→穿越→抵达并停留，约 6s / 可跳过 / 降级直显）
   ============================================================ */
var overlay = $('meteor-transition');
var tMeteor = $('tMeteor'), tQuote = $('tQuote'), tTitle = $('tTitle');
var tWarp = $('tWarp'), tDest = $('tDest');
var transitTimers = [];
var transitOpen = false;

/* 穿越星轨：两波光带从行进方向向四周放射——近处宽亮的第一波，远处细密的第二波 */
(function buildStreaks(){
  var html = '';
  for (var i = 0; i < 26; i++) {
    var a = (i * 360 / 26) + (i % 3) * 5;
    var d = (i % 7) * 0.055;
    html += '<i class="t-streak' + (i % 4 === 0 ? ' rose' : '') +
      '" style="--a:' + a.toFixed(1) + 'deg;--d:' + d.toFixed(2) + 's"></i>';
  }
  for (var j = 0; j < 18; j++) {
    var a2 = (j * 360 / 18) + 9;
    var d2 = 0.75 + (j % 6) * 0.09;
    html += '<i class="t-streak far" style="--a:' + a2.toFixed(1) + 'deg;--d:' + d2.toFixed(2) + 's"></i>';
  }
  tWarp.innerHTML = html;
})();

/* 五颗许愿星各自的坠落轨迹：左三颗向右下坠，右两颗向左下坠
   fr = 拖尾指向（沿轨迹回头看的方向）；sx/sy = 余星散开的反方向 */
var dirVars = {
  s1: { fx:'-34vw', fr:'30deg',   sx:'-58px',  sy:'-42px'  },
  s2: { fx:'-18vw', fr:'44deg',   sx:'-44px',  sy:'-62px'  },
  s3: { fx:'0vw',   fr:'60deg',   sx:'-24px',  sy:'-76px'  },
  s4: { fx:'18vw',  fr:'-132deg', sx:'44px',   sy:'-62px'  },
  s5: { fx:'34vw',  fr:'-150deg', sx:'58px',   sy:'-42px'  }
};
/* 每个板块对应一颗星球：玫瑰 / 麦田 / 琥珀 / 信纸 / 星光（取深沉色调，不压字） */
var secMeta = {
  about:      { title:'关于我',     quote:D.about.quote,      c1:'#d98f9b', c2:'#6e3644' },
  skills:     { title:'能力',       quote:D.skills.quote,     c1:'#d9b45e', c2:'#6f5420' },
  experience: { title:'经历与成绩', quote:D.experience.quote, c1:'#d99a52', c2:'#6e441c' },
  works:      { title:'作品星球',   quote:D.works.quote,      c1:'#d9c9a3', c2:'#6e5f42' },
  contact:    { title:'联系',       quote:D.contact.closing,  c1:'#9fb6d4', c2:'#3f5578' }
};

function clearTransitTimers(){
  transitTimers.forEach(clearTimeout);
  transitTimers = [];
}
function goToSection(key){
  var el = $(key);
  if (!el) return;
  // 一次只开一颗星球：隐藏其余板块，滚回顶部，像真的抵达了另一颗星
  document.querySelectorAll('.section, .site-footer').forEach(function(s){ s.classList.remove('on'); });
  el.classList.add('on');
  document.body.classList.add('planet-view');
  var back = $('backSky');
  if (back) back.hidden = false;
  window.scrollTo({ top: 0, behavior: 'auto' });
  // 补触发一次入场（display 由 none 变 block 后 IntersectionObserver 才会命中）
  setTimeout(function(){
    el.querySelectorAll('.rise').forEach(function(r){ r.classList.add('in'); });
  }, 60);
}
/* 回到星空：收起当前星球，回到五颗星 */
function returnHome(){
  document.querySelectorAll('.on').forEach(function(s){
    if (s.classList.contains('section') || s.classList.contains('site-footer')) s.classList.remove('on');
  });
  document.body.classList.remove('planet-view');
  var back = $('backSky');
  if (back) back.hidden = true;
  window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
}
function endTransit(key, instant){
  clearTransitTimers();
  sfxStopWhoosh();  // 跳过 / 收场时截断仍在响的风声
  sfxStopWarp();
  var launched = document.querySelector('.sky-star.launch');
  if (launched) launched.classList.remove('launch');
  if (key) goToSection(key);
  overlay.classList.remove('on','go','boom','warp','card-in');
  if (instant) {
    overlay.hidden = true;
  } else {
    transitTimers.push(setTimeout(function(){ overlay.hidden = true; }, 300));
  }
  transitOpen = false;
  document.removeEventListener('keydown', onTransitKey);
}
function onTransitKey(e){
  if (e.key === 'Escape') endTransit(currentTarget, true);
}
var currentTarget = null;

function playTransit(key, from, starEl){
  if (reduceMotion) { goToSection(key); return; }   // 降级：减少动效时直接到位
  if (transitOpen) return;
  currentTarget = key;
  transitOpen = true;
  if (starEl) starEl.classList.add('launch');       // 被选中的星星先亮一下再收进流星
  var meta = secMeta[key] || { title:'', quote:'', c1:'#ffe9a8', c2:'#c6963f' };
  tQuote.textContent = meta.quote;
  tTitle.textContent = meta.title;
  tDest.style.setProperty('--pc1', meta.c1);        // 目标星球换上该板块的配色
  tDest.style.setProperty('--pc2', meta.c2);
  var dv = dirVars[from] || dirVars.s3;
  tMeteor.style.setProperty('--fx', dv.fx);
  tMeteor.style.setProperty('--fr', dv.fr);
  tMeteor.style.setProperty('--sx', dv.sx);
  tMeteor.style.setProperty('--sy', dv.sy);

  overlay.hidden = false;
  overlay.classList.remove('go','boom','warp','card-in');
  void overlay.offsetWidth; // 强制回流，重启动画
  overlay.classList.add('on');

  document.addEventListener('keydown', onTransitKey);

  // 0.03s 起飞：点击即时反馈，风声起，星体按重力加速坠落
  transitTimers.push(setTimeout(function(){ overlay.classList.add('go'); sfxWhoosh(); }, 30));
  // 0.99s 落地：星体炸开，闪光 + 三环涟漪 + 星尘花瓣
  transitTimers.push(setTimeout(function(){ overlay.classList.add('boom'); sfxImpact(); }, 990));
  // 1.20s 穿越：两波星轨光带 + 路过星球迎面掠过 + 暗角收紧，滤波风从闷到亮
  transitTimers.push(setTimeout(function(){ overlay.classList.add('warp'); sfxWarp(); }, 1200));
  // 3.20s 抵达：星球减速停在上半空，卡片在下方夜空浮出，和弦轻轻落定
  transitTimers.push(setTimeout(function(){ overlay.classList.add('card-in'); sfxLand(); }, 3200));
  // 5.30s 切换滚动位置（在遮罩后完成，用户无感知）
  transitTimers.push(setTimeout(function(){
    goToSection(key);
    localStorage.setItem('luojiao-meteor-' + key, '1');
  }, 5300));
  // 6.00s 收场（卡片停留约 2.8s，够读完引言）
  transitTimers.push(setTimeout(function(){ endTransit(null, false); }, 6000));
}

/* ============================================================
   六、信封拆信：翻盖 3D 掀开 → 信纸滑出 → 进入子作品页

  env.addEventListener('click', function(){

});

/* ============================================================
   七、星空画布：星星 + 尘埃 + 环境流星（装饰，不影响阅读）
   ============================================================ */
var canvas = $('sky'), ctx = canvas.getContext('2d');
var W = 0, H = 0, stars = [], dust = [], ambMeteors = [];
function resize(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  buildStars();
}
function rand(a,b){ return a + Math.random() * (b - a); }
function buildStars(){
  stars = [];
  var n = Math.floor(W * H / 8500);
  for (var i = 0; i < n; i++) {
    stars.push({ x:Math.random()*W, y:Math.random()*H, r:rand(.4,1.5), p:Math.random()*Math.PI*2, s:rand(.4,1.2) });
  }
  dust = [];
  for (var j = 0; j < 60; j++) {
    dust.push({ x:Math.random()*W, y:Math.random()*H, r:rand(1,2.6), vx:rand(-.05,.05), vy:rand(-.04,.02), a:rand(.05,.14) });
  }
}
function drawSky(t){
  ctx.clearRect(0, 0, W, H);
  // 星星（暖白微闪）
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    ctx.globalAlpha = .35 + .45 * (0.5 + 0.5 * Math.sin(t * .001 * s.s + s.p));
    ctx.fillStyle = '#f5e6c8';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  // 尘埃
  ctx.fillStyle = '#bcd7ff';
  for (var j = 0; j < dust.length; j++) {
    var d = dust[j];
    d.x += d.vx; d.y += d.vy;
    if (d.x < -10) d.x = W + 10; if (d.x > W + 10) d.x = -10;
    if (d.y < -10) d.y = H + 10; if (d.y > H + 10) d.y = -10;
    ctx.globalAlpha = d.a;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  // 环境流星（纯装饰，与五颗可点击许愿星区分：从画面上方横穿而过）
  for (var k = ambMeteors.length - 1; k >= 0; k--) {
    var m = ambMeteors[k];
    m.life += 16; m.x += m.vx * .016; m.y += m.vy * .016;
    var fade = Math.min(1, m.life / 200) * Math.max(0, 1 - m.life / m.max);
    var sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
    var tx = m.x - m.vx / sp * m.len, ty = m.y - m.vy / sp * m.len;
    var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    g.addColorStop(0, 'rgba(255,246,220,' + (.92 * fade) + ')');
    g.addColorStop(.45, 'rgba(246,220,160,' + (.40 * fade) + ')');
    g.addColorStop(1, 'rgba(246,220,160,0)');
    // 先铺一层宽而淡的光晕，再叠一条细亮的核心线
    ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineCap = 'round';
    ctx.lineWidth = m.w * 3.2; ctx.globalAlpha = .30 * fade;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = m.w;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    // 头部一点星火
    ctx.globalAlpha = .9 * fade; ctx.fillStyle = '#fff8e4';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.w * 1.5, 0, Math.PI * 2); ctx.fill();
    if (m.life > m.max) ambMeteors.splice(k, 1);
  }
  ctx.globalAlpha = 1;
}
function spawnMeteor(){
  var fromLeft = Math.random() < .6;
  var ang = fromLeft ? rand(.42,.82) : rand(Math.PI*.72, Math.PI*.92);
  var sp = rand(420, 760);
  ambMeteors.push({
    x: fromLeft ? rand(-120, W*.6) : rand(W*.4, W+120),
    y: rand(-160, H*.3),
    vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    len: rand(170, 320), w: rand(1.4, 2.6),
    life: 0, max: rand(1100, 1800)
  });
}
var nextAmb = 1200;
function loop(t){
  if (!reduceMotion && t >= nextAmb) {
    nextAmb = t + rand(1100, 2600);
    spawnMeteor();
    // 偶尔来一场小小的流星雨（两到三颗先后划过）
    if (Math.random() < .28) {
      var extra = 1 + Math.floor(Math.random() * 2);
      for (var e = 0; e < extra; e++) {
        (function(delay){ setTimeout(spawnMeteor, delay); })(rand(160, 520));
      }
    }
  }
  if (!reduceMotion) drawSky(t); 
  requestAnimationFrame(loop);
}
resize();
window.addEventListener('resize', resize);
if (reduceMotion) { drawSky(0); } // 降级：静态星空一帧
else { requestAnimationFrame(loop); }
})();
</script>
</body>
