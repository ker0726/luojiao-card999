<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>作品详情 · 罗娇的星之星球</title>
<meta name="description" content="罗娇个人作品集 · 作品详情页" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%230d1b2a'/%3E%3Cpath d='M50 12 L56 44 L88 50 L56 56 L50 88 L44 56 L12 50 L44 44 Z' fill='%23f5e6c8'/%3E%3C/svg%3E" />
<link rel="preload" href="fonts/lxgwwenkai-subset.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/lxgwwenkai-latin-subset.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/cinzel-decorative-subset.woff2" as="font" type="font/woff2" crossorigin />
<style>
@font-face{
  font-family:'LXGW WenKai';
  src:url('fonts/lxgwwenkai-subset.woff2') format('woff2');
  font-weight:400;font-display:swap;
}
@font-face{
  font-family:'LXGW WenKai';
  src:url('fonts/lxgwwenkai-latin-subset.woff2') format('woff2');
  font-weight:400;font-display:swap;
  unicode-range:U+0020-007E;
}
@font-face{
  font-family:'Cinzel Decorative';
  src:url('fonts/cinzel-decorative-subset.woff2') format('woff2');
  font-weight:400;font-display:swap;
}
:root{
  --navy-0:#0d1b2a;--navy-1:#13243b;--star:#f5e6c8;
  --paper:#f5ecd7;--paper-2:#faf4e6;
  --rose:#e8a0a8;--wheat:#e6c468;
  --ink-on-dark:#e8ebf2;--ink-on-paper:#1c2b40;--muted:#9aa8c2;
  --kai:'LXGW WenKai','Songti SC','STSong',serif;
  --deco:'Cinzel Decorative','Georgia',serif;
  --sans:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --ease:cubic-bezier(.2,.8,.3,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;overflow-x:clip;}
body{
  background:linear-gradient(180deg,var(--navy-0),var(--navy-1) 70%,var(--navy-0));
  color:var(--ink-on-dark);font-family:var(--sans);font-size:16px;line-height:1.8;
  min-height:100vh;-webkit-font-smoothing:antialiased;
}
a{color:inherit;}
:focus-visible{outline:2px solid var(--wheat);outline-offset:3px;border-radius:4px;}

.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px;
  background:rgba(13,27,42,.82);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(245,230,200,.10);
}
.back-link{
  font-family:var(--kai);font-size:.92rem;letter-spacing:.14em;
  color:var(--star);text-decoration:none;
}
.back-link:hover{color:var(--wheat);}
.topbar .crumb{font-size:.76rem;letter-spacing:.2em;color:var(--muted);}

.paper{
  max-width:820px;margin:48px auto 80px;padding:0 22px;
}
.paper-inner{
  background:linear-gradient(165deg,var(--paper-2),var(--paper) 60%,#efe2c6);
  color:var(--ink-on-paper);border-radius:20px;
  box-shadow:0 24px 60px rgba(4,10,24,.55);
  padding:clamp(28px,6vw,56px);
  position:relative;
}
/* 信纸顶部的蜡封点缀，呼应信封墙 */
.paper-inner::before{
  content:'L';position:absolute;top:-22px;left:50%;transform:translateX(-50%);
  width:48px;height:48px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 34% 30%,#f0b6bc,var(--rose) 55%,#c77f88);
  color:#fff3f4;font-family:var(--kai);font-size:1.2rem;
  box-shadow:0 4px 12px rgba(120,60,66,.5),inset 0 0 0 3px rgba(255,255,255,.16);
}
.p-no{
  font-family:var(--deco);font-size:.9rem;letter-spacing:.3em;color:#8a7448;
  margin:6px 0 4px;
}
.p-name{
  font-family:var(--kai);font-weight:400;font-size:clamp(1.9rem,5.4vw,2.6rem);
  letter-spacing:.14em;margin:0 0 6px;
}
.p-status{
  display:inline-block;font-size:.72rem;letter-spacing:.16em;border-radius:999px;
  padding:3px 13px;border:1px solid rgba(160,120,40,.5);
  color:#8a6a1f;background:rgba(230,196,104,.22);margin-bottom:8px;
}
.p-oneliner{
  font-family:var(--kai);font-size:1.06rem;letter-spacing:.06em;
  color:#3a4a64;border-bottom:1px dashed rgba(28,43,64,.25);
  padding-bottom:18px;margin:12px 0 26px;
}
.p-sec{margin-bottom:30px;}
.p-sec h2{
  font-family:var(--kai);font-weight:400;font-size:1.14rem;letter-spacing:.2em;
  color:#7a5a20;margin:0 0 10px;display:flex;align-items:center;gap:10px;
}
.p-sec h2::before{content:'✦';color:var(--rose);font-size:.85em;}
.p-sec p{margin:0;font-size:.95rem;line-height:1.9;color:#2c3a52;}
.p-stack{display:flex;gap:8px;flex-wrap:wrap;}
.p-stack span{
  font-size:.78rem;padding:3px 13px;border-radius:999px;
  background:rgba(28,43,64,.08);border:1px solid rgba(28,43,64,.12);color:#41506a;
}
/* 截图占位：预留图片位，不编造 */
.p-shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;}
.shot-ph{
  aspect-ratio:16/10;border-radius:12px;border:2px dashed rgba(28,43,64,.28);
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
  color:#7a8aa5;font-size:.78rem;letter-spacing:.14em;background:rgba(28,43,64,.04);
}
.shot-ph svg{opacity:.6;}
.p-retro{
  background:rgba(230,196,104,.14);border-left:3px solid var(--wheat);
  border-radius:0 12px 12px 0;padding:16px 20px;
}
.p-retro h2{margin-bottom:6px;}
.p-actions{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap;}
.p-btn{
  font-family:var(--kai);font-size:.92rem;letter-spacing:.16em;text-decoration:none;
  padding:10px 26px;border-radius:999px;
  transition:transform .3s var(--ease),box-shadow .3s var(--ease);
}
.p-btn:hover{transform:translateY(-2px);}
.p-btn.primary{background:var(--ink-on-paper);color:var(--paper-2);}
.p-btn.ghost{border:1px dashed rgba(28,43,64,.4);color:#5a6a84;cursor:default;}
.missing{
  max-width:560px;margin:16vh auto;padding:40px 30px;text-align:center;
  background:rgba(19,36,59,.8);border-radius:18px;border:1px solid rgba(245,230,200,.14);
}
.missing h1{font-family:var(--kai);font-weight:400;letter-spacing:.2em;font-size:1.5rem;color:var(--star);}
.missing p{font-size:.9rem;color:var(--muted);}
.missing a{color:var(--wheat);}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<header class="topbar">
  <a class="back-link" href="index.html#works">← 返回信封墙</a>
  <span class="crumb">星之星球 · 作品详情</span>
</header>

<main class="paper" id="paper" hidden>
  <article class="paper-inner">
    <p class="p-no" id="pNo"></p>
    <h1 class="p-name" id="pName"></h1>
    <span class="p-status" id="pStatus"></span>
    <p class="p-oneliner" id="pOneliner"></p>

    <section class="p-sec"><h2>为什么做</h2><p id="pWhy"></p></section>
    <section class="p-sec"><h2>我做了什么</h2><p id="pRole"></p></section>
    <section class="p-sec"><h2>技术栈</h2><div class="p-stack" id="pStack"></div></section>
    <section class="p-sec">
      <h2>截图 / 动图</h2>
      <div class="p-shots" id="pShots"></div>
    </section>
    <section class="p-sec p-retro"><h2>复盘</h2><p id="pRetro"></p></section>

    <div class="p-actions" id="pActions"></div>
  </article>
</main>

<div class="missing" id="missing" hidden>
  <h1>这封信还没有寄到</h1>
  <p>没有找到对应的作品，可能是链接有误。</p>
  <p><a href="index.html#works">← 回到信封墙看看其他信</a></p>
</div>

<script src="data.js"></script>
<script>
(function(){
'use strict';
// 子作品页统一模板：从 data.js 取数，地址栏 ?id= 决定展示哪个作品
var params = new URLSearchParams(location.search);
var id = params.get('id');
var work = null;
(window.SITE_DATA.works.list || []).forEach(function(w){ if (w.id === id) work = w; });

var missing = document.getElementById('missing');
var paper = document.getElementById('paper');

// 404 降级：未知 id 不白屏，给出返回入口
if (!work) {
  missing.hidden = false;
  document.title = '未找到作品 · 罗娇的星之星球';
  return;
}

var d = work.detail || {};
document.title = work.name + ' · 罗娇的星之星球';
document.getElementById('pNo').textContent = 'LETTER · ' + work.no;
document.getElementById('pName').textContent = work.name;
document.getElementById('pStatus').textContent = work.status;
document.getElementById('pOneliner').textContent = d.oneliner || '【待填】';
document.getElementById('pWhy').textContent = d.why || '【待填】';
document.getElementById('pRole').textContent = d.role || '【待填】';
document.getElementById('pRetro').textContent = d.retro || '【待填】';

// 技术栈：按 · 或 / 拆成小胶囊
var stackText = d.stack || '【待填】';
document.getElementById('pStack').innerHTML = stackText.split(/[·\/]/).map(function(s){
  return '<span>' + s.trim() + '</span>';
}).join('');

// 截图：有图放图，没图放占位（不编造）
var shots = d.shots || [];
var shotsBox = document.getElementById('pShots');
if (shots.length) {
  shotsBox.innerHTML = shots.map(function(src, i){
    return '<img src="' + src + '" alt="' + work.name + ' 界面截图 ' + (i + 1) + '" style="border-radius:12px;" />';
  }).join('');
} else {
  shotsBox.innerHTML =
    '<div class="shot-ph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7a8aa5" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-4 4 3 4-4 5 5"/></svg>截图【待填】</div>' +
    '<div class="shot-ph"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7a8aa5" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3z"/></svg>动图【待填】</div>';
}

// 行动按钮：有正式链接才放可点按钮，否则「部署中」占位，避免死链
var actions = document.getElementById('pActions');
if (work.link) {
  actions.innerHTML = '<a class="p-btn primary" href="' + work.link + '" target="_blank" rel="noopener">访问在线作品 →</a>';
} else {
  actions.innerHTML = '<span class="p-btn ghost" aria-disabled="true">部署中，敬请期待</span>';
}
paper.hidden = false;
})();
</script>
</body>
</html>
